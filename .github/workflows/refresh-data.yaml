name: refresh-data

# Rebuild the ASA data snapshots and commit them. Runs early each morning
# during the NWSL season, and on demand.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::arrow
            any::dplyr
            any::tidyr
            any::itscalledsoccer
            any::pkgload
          needs: |

      - name: Refresh snapshots
        run: Rscript data-raw/refresh_data.R

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/*.parquet
          if git diff --staged --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(data): refresh ASA snapshots [skip ci]"
            git push
          fi
